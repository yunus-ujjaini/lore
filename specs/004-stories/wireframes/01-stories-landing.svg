<?xml version="1.0" encoding="UTF-8"?>
<!-- Stories Landing Page - Dark theme (matching earlier features) -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c7ddf5"/>
      <stop offset="100%" stop-color="#b8d4f0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- Title -->
  <text x="960" y="28" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="18" font-weight="700" fill="#4b5563" letter-spacing="1">
    STORIES LANDING PAGE
  </text>

  <!-- Labels -->
  <text x="40" y="52" fill="#8b5cf6" font-family="system-ui, sans-serif"
        font-size="18" font-weight="bold">DESKTOP (16:9)</text>
  <text x="1500" y="52" fill="#d946ef" font-family="system-ui, sans-serif"
        font-size="15" font-weight="bold">MOBILE</text>

  <!-- ================= DESKTOP (1280x720) ================= -->
  <g id="desktop" transform="translate(40, 60)">
    <rect width="1280" height="720" rx="8" fill="#2f3d2e" stroke="#5a6558"/>

    <!-- Hero Section - Dark atmospheric -->
    <rect x="0" y="0" width="1280" height="200" fill="#1f2b1e"/>
    <text x="640" y="80" text-anchor="middle" font-family="Georgia, serif" 
          font-size="48" font-weight="bold" fill="#c9b896" letter-spacing="4">STORIES</text>
    <text x="640" y="120" text-anchor="middle" font-family="Georgia, serif" 
          font-size="16" fill="#8a9a88" font-style="italic">Tales from the Continent</text>
    <text x="640" y="150" text-anchor="middle" font-family="system-ui, sans-serif" 
          font-size="14" fill="#8a9a88">Discover the stories behind the monsters</text>

    <!-- Story Cards Grid - Dark cards with atmospheric styling -->
    <g transform="translate(40, 230)">
      <!-- Story Card 1 -->
      <g>
        <rect width="380" height="220" rx="8" fill="#1f2b1e" stroke="#5a6558"/>
        <rect width="380" height="120" rx="8" fill="#4a5548"/>
        <text x="190" y="65" text-anchor="middle" font-size="14" fill="#8a9a88">[Story Image]</text>
        <text x="20" y="150" font-size="18" font-weight="bold" fill="#c9b896">The Last Wish</text>
        <text x="20" y="175" font-size="12" fill="#8a9a88">A dying wish binds a witcher...</text>
        <text x="20" y="200" font-size="11" fill="#5a6558">Related: Leshen</text>
      </g>
      
      <!-- Story Card 2 -->
      <g transform="translate(410, 0)">
        <rect width="380" height="220" rx="8" fill="#1f2b1e" stroke="#5a6558"/>
        <rect width="380" height="120" rx="8" fill="#4a5548"/>
        <text x="190" y="65" text-anchor="middle" font-size="14" fill="#8a9a88">[Story Image]</text>
        <text x="20" y="150" font-size="18" font-weight="bold" fill="#c9b896">The Giant of the Pass</text>
        <text x="20" y="175" font-size="12" fill="#8a9a88">A griffin guards the mountain...</text>
        <text x="20" y="200" font-size="11" fill="#5a6558">Related: Griffin, Leshen</text>
      </g>

      <!-- Story Card 3 -->
      <g transform="translate(820, 0)">
        <rect width="380" height="220" rx="8" fill="#1f2b1e" stroke="#5a6558"/>
        <rect width="380" height="120" rx="8" fill="#4a5548"/>
        <text x="190" y="65" text-anchor="middle" font-size="14" fill="#8a9a88">[Story Image]</text>
        <text x="20" y="150" font-size="18" font-weight="bold" fill="#c9b896">Striga of Maribor</text>
        <text x="20" y="175" font-size="12" fill="#8a9a88">The cursed princess awakens...</text>
        <text x="20" y="200" font-size="11" fill="#5a6558">Related: Striga</text>
      </g>
    </g>

    <!-- Footer -->
    <rect x="0" y="660" width="1280" height="60" fill="#1f2b1e"/>
    <text x="24" y="696" font-family="system-ui, sans-serif" font-size="14" fill="#8a9a88">3 stories — data-driven from content layer</text>

    <!-- Callouts -->
    <g class="callout" transform="translate(230, 100)">
      <circle r="14" fill="#dc2626"/><text y="5" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">1</text>
    </g>
    <g class="callout" transform="translate(230, 340)">
      <circle r="14" fill="#dc2626"/><text y="5" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">2</text>
    </g>
  </g>

  <!-- ================= MOBILE (360x720) ================= -->
  <g id="mobile" transform="translate(1360, 60)">
    <rect width="360" height="720" rx="24" fill="#2f3d2e" stroke="#5a6558"/>

    <!-- Mobile Hero -->
    <rect x="0" y="0" width="360" height="120" rx="24" fill="#1f2b1e"/>
    <text x="180" y="50" text-anchor="middle" font-family="Georgia, serif" 
          font-size="28" font-weight="bold" fill="#c9b896" letter-spacing="2">STORIES</text>
    <text x="180" y="80" text-anchor="middle" font-family="Georgia, serif" 
          font-size="12" fill="#8a9a88">Tales from the Continent</text>

    <!-- Mobile Story Cards -->
    <g transform="translate(20, 140)">
      <rect width="320" height="160" rx="8" fill="#1f2b1e" stroke="#5a6558"/>
      <rect width="320" height="90" rx="8" fill="#4a5548"/>
      <text x="160" y="50" text-anchor="middle" font-size="12" fill="#8a9a88">[Story Image]</text>
      <text x="20" y="115" font-size="14" font-weight="bold" fill="#c9b896">The Last Wish</text>
      <text x="20" y="135" font-size="11" fill="#8a9a88">A dying wish binds...</text>
      <text x="20" y="155" font-size="10" fill="#5a6558">Related: Leshen</text>
    </g>
    <g transform="translate(20, 320)">
      <rect width="320" height="160" rx="8" fill="#1f2b1e" stroke="#5a6558"/>
      <rect width="320" height="90" rx="8" fill="#4a5548"/>
      <text x="160" y="50" text-anchor="middle" font-size="12" fill="#8a9a88">[Story Image]</text>
      <text x="20" y="115" font-size="14" font-weight="bold" fill="#c9b896">The Giant of the Pass</text>
      <text x="20" y="135" font-size="11" fill="#8a9a88">A griffin guards...</text>
      <text x="20" y="155" font-size="10" fill="#5a6558">Related: Griffin, Leshen</text>
    </g>

    <!-- Footer -->
    <rect x="0" y="664" width="360" height="56" rx="24" fill="#1f2b1e"/>
    <text x="20" y="697" font-family="system-ui, sans-serif" font-size="14" fill="#8a9a88">Stories — About</text>

    <!-- Mobile callouts -->
    <g class="callout" transform="translate(180, 60)">
      <circle r="14" fill="#dc2626"/><text y="5" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">1</text>
    </g>
    <g class="callout" transform="translate(180, 220)">
      <circle r="14" fill="#dc2626"/><text y="5" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">2</text>
    </g>
  </g>

  <!-- ================= ANNOTATIONS (8 groups, 2 rows x 4) ================= -->
  <g id="annotations" transform="translate(40, 800)">
    <rect width="1840" height="220" rx="8" fill="#dcc8a8" stroke="#b8a080"/>

    <!-- Row 1 -->
    <g font-family="system-ui, sans-serif" fill="#1f2937">
      <!-- US-001 -->
      <text x="24" y="24" font-size="14" font-weight="bold">1. Browse Stories</text>
      <text x="24" y="44" font-size="14" fill="#374151">Illustrated story cards with image, title, summary.</text>
      <rect x="24" y="54" width="56" height="22" rx="9" fill="#0891b2"/><text x="52" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">US-001</text>
      <rect x="88" y="54" width="52" height="22" rx="9" fill="#2563eb"/><text x="114" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">FR-001</text>
      <rect x="148" y="54" width="52" height="22" rx="9" fill="#2563eb"/><text x="174" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">FR-002</text>
      <rect x="208" y="54" width="52" height="22" rx="9" fill="#2563eb"/><text x="234" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">FR-003</text>
      <rect x="268" y="54" width="52" height="22" rx="9" fill="#7a5a3a"/><text x="294" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">SC-001</text>

      <!-- US-002 -->
      <text x="340" y="24" font-size="14" font-weight="bold">2. Read a Story</text>
      <text x="340" y="44" font-size="14" fill="#374151">Story Reader with hero, ordered sections.</text>
      <rect x="340" y="54" width="56" height="22" rx="9" fill="#0891b2"/><text x="368" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">US-002</text>
      <rect x="404" y="54" width="52" height="22" rx="9" fill="#2563eb"/><text x="430" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">FR-004</text>
      <rect x="464" y="54" width="52" height="22" rx="9" fill="#2563eb"/><text x="490" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">FR-005</text>
      <rect x="524" y="54" width="52" height="22" rx="9" fill="#2563eb"/><text x="550" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">FR-006</text>
      <rect x="584" y="54" width="52" height="22" rx="9" fill="#7a5a3a"/><text x="610" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">SC-002</text>

      <!-- US-003 -->
      <text x="680" y="24" font-size="14" font-weight="bold">3. Related Monsters</text>
      <text x="680" y="44" font-size="14" fill="#374151">Two-way discovery flow.</text>
      <rect x="680" y="54" width="56" height="22" rx="9" fill="#0891b2"/><text x="708" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">US-003</text>
      <rect x="744" y="54" width="52" height="22" rx="9" fill="#2563eb"/><text x="770" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">FR-011</text>
      <rect x="804" y="54" width="52" height="22" rx="9" fill="#2563eb"/><text x="830" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">FR-012</text>
      <rect x="864" y="54" width="52" height="22" rx="9" fill="#7a5a3a"/><text x="890" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">SC-005</text>

      <!-- US-004 -->
      <text x="950" y="24" font-size="14" font-weight="bold">4. Back Navigation</text>
      <text x="950" y="44" font-size="14" fill="#374151">Integrated back to Stories.</text>
      <rect x="950" y="54" width="56" height="22" rx="9" fill="#0891b2"/><text x="978" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">US-004</text>
      <rect x="1014" y="54" width="52" height="22" rx="9" fill="#2563eb"/><text x="1040" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">FR-013</text>
      <rect x="1074" y="54" width="52" height="22" rx="9" fill="#7a5a3a"/><text x="1100" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">SC-006</text>
    </g>

    <!-- Row 2 -->
    <g font-family="system-ui, sans-serif" fill="#1f2937">
      <!-- US-005 -->
      <text x="24" y="110" font-size="14" font-weight="bold">5. Missing Story</text>
      <text x="24" y="130" font-size="14" fill="#374151">Not-found state for invalid IDs.</text>
      <rect x="24" y="140" width="56" height="22" rx="9" fill="#0891b2"/><text x="52" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">US-005</text>
      <rect x="88" y="140" width="52" height="22" rx="9" fill="#2563eb"/><text x="114" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">FR-014</text>
      <rect x="148" y="140" width="52" height="22" rx="9" fill="#7a5a3a"/><text x="174" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">SC-007</text>

      <!-- US-006 -->
      <text x="250" y="110" font-size="14" font-weight="bold">6. Responsive</text>
      <text x="250" y="130" font-size="14" fill="#374151">Desktop/tablet/mobile.</text>
      <rect x="250" y="140" width="56" height="22" rx="9" fill="#0891b2"/><text x="278" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">US-006</text>
      <rect x="314" y="140" width="52" height="22" rx="9" fill="#2563eb"/><text x="340" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">FR-017</text>
      <rect x="374" y="140" width="52" height="22" rx="9" fill="#7a5a3a"/><text x="400" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">SC-011</text>

      <!-- US-007 -->
      <text x="470" y="110" font-size="14" font-weight="bold">7. Accessible</text>
      <text x="470" y="130" font-size="14" fill="#374151">Keyboard, focus, alt text, reduced-motion.</text>
      <rect x="470" y="140" width="56" height="22" rx="9" fill="#0891b2"/><text x="498" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">US-007</text>
      <rect x="534" y="140" width="52" height="22" rx="9" fill="#2563eb"/><text x="560" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">FR-018</text>
      <rect x="594" y="140" width="52" height="22" rx="9" fill="#7a5a3a"/><text x="620" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">SC-012</text>

      <!-- US-008 -->
      <text x="700" y="110" font-size="14" font-weight="bold">8. Schema Migration</text>
      <text x="700" y="130" font-size="14" fill="#374151">content → sections (≥4 per story).</text>
      <rect x="700" y="140" width="56" height="22" rx="9" fill="#0891b2"/><text x="728" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">US-008</text>
      <rect x="764" y="140" width="52" height="22" rx="9" fill="#2563eb"/><text x="790" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">FR-009</text>
      <rect x="824" y="140" width="52" height="22" rx="9" fill="#2563eb"/><text x="850" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">FR-010</text>
      <rect x="884" y="140" width="52" height="22" rx="9" fill="#7a5a3a"/><text x="910" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">SC-008</text>
    </g>
  </g>

  <!-- Signature -->
  <text x="40" y="1060" fill="#4b5563" font-family="system-ui, sans-serif"
        font-size="18" font-weight="bold">
    004:01 | Stories Landing | SpecKit
  </text>
</svg>
