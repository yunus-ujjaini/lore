<?xml version="1.0" encoding="UTF-8"?>
<!-- Story Reader Page - Dark theme (matching earlier features) -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c7ddf5"/>
      <stop offset="100%" stop-color="#b8d4f0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- Title -->
  <text x="960" y="28" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="18" font-weight="700" fill="#4b5563" letter-spacing="1">
    STORY READER
  </text>

  <!-- Labels -->
  <text x="40" y="52" fill="#8b5cf6" font-family="system-ui, sans-serif"
        font-size="18" font-weight="bold">DESKTOP (16:9)</text>
  <text x="1500" y="52" fill="#d946ef" font-family="system-ui, sans-serif"
        font-size="15" font-weight="bold">MOBILE</text>

  <!-- ================= DESKTOP (1280x720) ================= -->
  <g id="desktop" transform="translate(40, 60)">
    <rect width="1280" height="720" rx="8" fill="#2f3d2e" stroke="#5a6558"/>

    <!-- Hero Section - Full-width image with overlaid text (dark) -->
    <rect x="0" y="0" width="1280" height="300" fill="#1f2b1e"/>
    <rect x="0" y="0" width="1280" height="300" fill="#4a5548" opacity="0.6"/>
    <text x="640" y="120" text-anchor="middle" font-family="system-ui, sans-serif" 
          font-size="14" fill="#8a9a88">[Story Hero Image - 16:9]</text>
    
    <!-- Overlaid text on hero -->
    <g transform="translate(60, 220)">
      <text font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#c9b896">The Last Wish</text>
      <text y="25" font-size="14" fill="#8a9a88">A dying wish binds a witcher and a sorceress</text>
    </g>

    <!-- Back navigation -->
    <text x="60" y="40" font-family="system-ui, sans-serif" font-size="14" fill="#8b5cf6">← Back to Stories</text>

    <!-- Story Content Section - Dark -->
    <rect x="0" y="320" width="1280" height="320" fill="#2f3d2e"/>
    <g transform="translate(200, 340)">
      <!-- Section 1 -->
      <text font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#c9b896">The Castle</text>
      <text y="25" font-family="system-ui, sans-serif" font-size="14" fill="#b8a886" max-width="800">The witcher came to the dame's castle seeking only a bounty, but the djinn's final wish twisted fate itself.</text>
      
      <!-- Section 2 -->
      <text y="70" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#c9b896">The Djinn</text>
      <text y="95" font-family="system-ui, sans-serif" font-size="14" fill="#b8a886" max-width="800">By the time the flames settled, the words had been spoken.</text>
      
      <!-- Section 3 -->
      <text y="140" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#c9b896">The Wish</text>
      <text y="165" font-family="system-ui, sans-serif" font-size="14" fill="#b8a886" max-width="800">Neither he nor the sorceress could remember exactly what they had agreed to.</text>
      
      <!-- Section 4 -->
      <text y="210" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#c9b896">The Binding</text>
      <text y="235" font-family="system-ui, sans-serif" font-size="14" fill="#b8a886" max-width="800">Only that it bound them both, for good or ill.</text>
    </g>

    <!-- Related Monsters -->
    <rect x="0" y="660" width="1280" height="60" fill="#1f2b1e"/>
    <text x="24" y="696" font-family="system-ui, sans-serif" font-size="14" fill="#8a9a88">Related: Leshen</text>

    <!-- Callouts -->
    <g class="callout" transform="translate(640, 150)">
      <circle r="14" fill="#dc2626"/><text y="5" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">1</text>
    </g>
    <g class="callout" transform="translate(640, 400)">
      <circle r="14" fill="#dc2626"/><text y="5" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">2</text>
    </g>
    <g class="callout" transform="translate(100, 40)">
      <circle r="14" fill="#dc2626"/><text y="5" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">3</text>
    </g>
    <g class="callout" transform="translate(640, 690)">
      <circle r="14" fill="#dc2626"/><text y="5" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">4</text>
    </g>
  </g>

  <!-- ================= MOBILE (360x720) ================= -->
  <g id="mobile" transform="translate(1360, 60)">
    <rect width="360" height="720" rx="24" fill="#2f3d2e" stroke="#5a6558"/>

    <!-- Mobile Hero -->
    <rect x="0" y="0" width="360" height="200" rx="24" fill="#1f2b1e"/>
    <rect x="0" y="0" width="360" height="200" fill="#4a5548" opacity="0.6"/>
    <text x="180" y="100" text-anchor="middle" font-family="system-ui, sans-serif" 
          font-size="12" fill="#8a9a88">[Story Image]</text>
    <g transform="translate(20, 150)">
      <text font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#c9b896">The Last Wish</text>
      <text y="20" font-size="12" fill="#8a9a88">A dying wish binds...</text>
    </g>

    <!-- Back navigation -->
    <text x="20" y="30" font-family="system-ui, sans-serif" font-size="12" fill="#8b5cf6">← Back</text>

    <!-- Story Content -->
    <rect x="0" y="220" width="360" height="420" fill="#2f3d2e"/>
    <g transform="translate(20, 240)">
      <text font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#c9b896">The Castle</text>
      <text y="20" font-family="system-ui, sans-serif" font-size="12" fill="#b8a886">The witcher came to the dame's castle...</text>
      
      <text y="60" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#c9b896">The Djinn</text>
      <text y="80" font-family="system-ui, sans-serif" font-size="12" fill="#b8a886">By the time the flames settled...</text>
      
      <text y="120" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#c9b896">The Wish</text>
      <text y="140" font-family="system-ui, sans-serif" font-size="12" fill="#b8a886">Neither he nor the sorceress could remember...</text>
      
      <text y="180" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#c9b896">The Binding</text>
      <text y="200" font-family="system-ui, sans-serif" font-size="12" fill="#b8a886">Only that it bound them both...</text>
    </g>

    <!-- Footer -->
    <rect x="0" y="664" width="360" height="56" rx="24" fill="#1f2b1e"/>
    <text x="20" y="697" font-family="system-ui, sans-serif" font-size="14" fill="#8a9a88">Related: Leshen</text>

    <!-- Mobile callouts -->
    <g class="callout" transform="translate(180, 100)">
      <circle r="14" fill="#dc2626"/><text y="5" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">1</text>
    </g>
    <g class="callout" transform="translate(180, 350)">
      <circle r="14" fill="#dc2626"/><text y="5" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">2</text>
    </g>
    <g class="callout" transform="translate(20, 30)">
      <circle r="14" fill="#dc2626"/><text y="5" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">3</text>
    </g>
    <g class="callout" transform="translate(180, 690)">
      <circle r="14" fill="#dc2626"/><text y="5" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">4</text>
    </g>
  </g>

  <!-- ================= ANNOTATIONS (8 groups, 2 rows x 4) ================= -->
  <g id="annotations" transform="translate(40, 800)">
    <rect width="1840" height="220" rx="8" fill="#dcc8a8" stroke="#b8a080"/>

    <!-- Row 1 -->
    <g font-family="system-ui, sans-serif" fill="#1f2937">
      <!-- US-002 -->
      <text x="24" y="24" font-size="14" font-weight="bold">1. Story Reader Hero</text>
      <text x="24" y="44" font-size="14" fill="#374151">Full-width hero with title, summary, image.</text>
      <rect x="24" y="54" width="56" height="22" rx="9" fill="#0891b2"/><text x="52" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">US-002</text>
      <rect x="88" y="54" width="52" height="22" rx="9" fill="#2563eb"/><text x="114" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">FR-005</text>
      <rect x="148" y="54" width="52" height="22" rx="9" fill="#2563eb"/><text x="174" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">FR-006</text>
      <rect x="208" y="54" width="52" height="22" rx="9" fill="#7a5a3a"/><text x="234" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">SC-003</text>

      <!-- US-002 (continued) -->
      <text x="280" y="24" font-size="14" font-weight="bold">2. Ordered Sections</text>
      <text x="280" y="44" font-size="14" fill="#374151">Sections in data order; short/long stories.</text>
      <rect x="280" y="54" width="56" height="22" rx="9" fill="#0891b2"/><text x="308" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">US-002</text>
      <rect x="344" y="54" width="52" height="22" rx="9" fill="#2563eb"/><text x="370" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">FR-007</text>
      <rect x="404" y="54" width="52" height="22" rx="9" fill="#2563eb"/><text x="430" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">FR-008</text>
      <rect x="464" y="54" width="52" height="22" rx="9" fill="#7a5a3a"/><text x="490" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">SC-004</text>

      <!-- US-004 -->
      <text x="540" y="24" font-size="14" font-weight="bold">3. Back Navigation</text>
      <text x="540" y="44" font-size="14" fill="#374151">Integrated back to Stories.</text>
      <rect x="540" y="54" width="56" height="22" rx="9" fill="#0891b2"/><text x="568" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">US-004</text>
      <rect x="604" y="54" width="52" height="22" rx="9" fill="#2563eb"/><text x="630" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">FR-013</text>
      <rect x="664" y="54" width="52" height="22" rx="9" fill="#7a5a3a"/><text x="690" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">SC-006</text>

      <!-- US-003 -->
      <text x="740" y="24" font-size="14" font-weight="bold">4. Related Monsters</text>
      <text x="740" y="44" font-size="14" fill="#374151">Horizontal scrollable cards.</text>
      <rect x="740" y="54" width="56" height="22" rx="9" fill="#0891b2"/><text x="768" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">US-003</text>
      <rect x="804" y="54" width="52" height="22" rx="9" fill="#2563eb"/><text x="830" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">FR-011</text>
      <rect x="864" y="54" width="52" height="22" rx="9" fill="#2563eb"/><text x="890" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">FR-012</text>
      <rect x="924" y="54" width="52" height="22" rx="9" fill="#7a5a3a"/><text x="950" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">SC-005</text>
    </g>

    <!-- Row 2 -->
    <g font-family="system-ui, sans-serif" fill="#1f2937">
      <!-- US-005 -->
      <text x="24" y="110" font-size="14" font-weight="bold">5. Missing Story</text>
      <text x="24" y="130" font-size="14" fill="#374151">Not-found state for invalid IDs.</text>
      <rect x="24" y="140" width="56" height="22" rx="9" fill="#0891b2"/><text x="52" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">US-005</text>
      <rect x="88" y="140" width="52" height="22" rx="9" fill="#2563eb"/><text x="114" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">FR-014</text>
      <rect x="148" y="140" width="52" height="22" rx="9" fill="#7a5a3a"/><text x="174" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">SC-007</text>

      <!-- US-006 -->
      <text x="250" y="110" font-size="14" font-weight="bold">6. Responsive</text>
      <text x="250" y="130" font-size="14" fill="#374151">Desktop/tablet/mobile.</text>
      <rect x="250" y="140" width="56" height="22" rx="9" fill="#0891b2"/><text x="278" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">US-006</text>
      <rect x="314" y="140" width="52" height="22" rx="9" fill="#2563eb"/><text x="340" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">FR-017</text>
      <rect x="374" y="140" width="52" height="22" rx="9" fill="#7a5a3a"/><text x="400" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">SC-011</text>

      <!-- US-007 -->
      <text x="470" y="110" font-size="14" font-weight="bold">7. Accessible</text>
      <text x="470" y="130" font-size="14" fill="#374151">Keyboard, focus, alt text, reduced-motion.</text>
      <rect x="470" y="140" width="56" height="22" rx="9" fill="#0891b2"/><text x="498" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">US-007</text>
      <rect x="534" y="140" width="52" height="22" rx="9" fill="#2563eb"/><text x="560" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">FR-018</text>
      <rect x="594" y="140" width="52" height="22" rx="9" fill="#7a5a3a"/><text x="620" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">SC-012</text>

      <!-- US-008 -->
      <text x="700" y="110" font-size="14" font-weight="bold">8. Schema Migration</text>
      <text x="700" y="130" font-size="14" fill="#374151">content → sections (≥4 per story).</text>
      <rect x="700" y="140" width="56" height="22" rx="9" fill="#0891b2"/><text x="728" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">US-008</text>
      <rect x="764" y="140" width="52" height="22" rx="9" fill="#2563eb"/><text x="790" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">FR-009</text>
      <rect x="824" y="140" width="52" height="22" rx="9" fill="#2563eb"/><text x="850" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">FR-010</text>
      <rect x="884" y="140" width="52" height="22" rx="9" fill="#7a5a3a"/><text x="910" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">SC-008</text>
    </g>
  </g>

  <!-- Signature -->
  <text x="40" y="1060" fill="#4b5563" font-family="system-ui, sans-serif"
        font-size="18" font-weight="bold">
    004:02 | Story Reader | SpecKit
  </text>
</svg>
